name: CrateDig Auto-Roll

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  auto-roll:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wake up backend
        run: |
          echo "Waking up Render backend..."
          response=$(curl -s --max-time 90 https://cratedig-api.onrender.com/)
          echo "Backend response: $response"

      - name: Fetch library and pick seeds
        id: seeds
        run: |
          library=$(curl -s --max-time 30 https://crate-dig-two.vercel.app/api/library)

          songs_count=$(echo "$library" | node -e "
            const lib = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log(lib.library?.songs?.length ?? 0);
          ")

          if [ "$songs_count" -eq 0 ]; then
            echo "No library uploaded — upload songs at crate-dig-two.vercel.app first"
            exit 1
          fi

          seeds=$(echo "$library" | node -e "
            const lib = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const songs = lib.library.songs;
            const shuffled = songs.sort(() => Math.random() - 0.5);
            console.log(JSON.stringify(shuffled.slice(0, 8).map(s => ({ artist: s.artist, title: s.title }))));
          ")

          echo "Seeds: $seeds"
          echo "seeds=$seeds" >> $GITHUB_OUTPUT

      - name: Roll tracks
        id: roll
        run: |
          seeds='${{ steps.seeds.outputs.seeds }}'
          body=$(node -e "console.log(JSON.stringify({ seeds: $seeds, desired_count: 50 }))")

          response=$(curl -s --max-time 120 -X POST https://cratedig-api.onrender.com/roll \
            -H "Content-Type: application/json" \
            -d "$body")

          track_count=$(echo "$response" | node -e "
            const r = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (r.detail) { console.error('Roll error:', r.detail); process.exit(1); }
            console.log(r.tracks.length);
          ")

          echo "Tracks found: $track_count"
          echo "roll_response<<EOF" >> $GITHUB_OUTPUT
          echo "$response" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create YouTube playlist
        id: playlist
        run: |
          roll='${{ steps.roll.outputs.roll_response }}'
          today=$(date -u +%Y-%m-%d)

          body=$(node -e "
            const roll = JSON.parse(process.argv[1]);
            const video_ids = roll.tracks.map(t => t.videoId);
            console.log(JSON.stringify({ title: 'CrateDig Auto-Roll $today', video_ids }));
          " "$roll")

          response=$(curl -s --max-time 60 -X POST https://cratedig-api.onrender.com/create-playlist \
            -H "Content-Type: application/json" \
            -d "$body")

          echo "Playlist response: $response"
          playlist_id=$(echo "$response" | node -e "
            const r = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log(r.playlist_id);
          ")
          playlist_url=$(echo "$response" | node -e "
            const r = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log(r.url);
          ")

          echo "playlist_id=$playlist_id" >> $GITHUB_OUTPUT
          echo "playlist_url=$playlist_url" >> $GITHUB_OUTPUT

      - name: Save roll history
        continue-on-error: true
        run: |
          roll='${{ steps.roll.outputs.roll_response }}'
          seeds='${{ steps.seeds.outputs.seeds }}'
          playlist_id='${{ steps.playlist.outputs.playlist_id }}'
          playlist_url='${{ steps.playlist.outputs.playlist_url }}'

          body=$(node -e "
            const roll = JSON.parse(process.argv[1]);
            const seeds = JSON.parse(process.argv[2]);
            const body = {
              playlistId: process.argv[3],
              playlistUrl: process.argv[4],
              seedCount: 8,
              trackCount: roll.tracks.length,
              failedSeeds: roll.seeds_failed ?? 0,
              thumbnailUrl: roll.tracks[0]?.thumbnail ?? null,
              seeds,
              tracks: roll.tracks.map(t => ({ videoId: t.videoId, title: t.title, artist: t.artist }))
            };
            console.log(JSON.stringify(body));
          " "$roll" "$seeds" "$playlist_id" "$playlist_url")

          curl -s --max-time 30 -X POST https://crate-dig-two.vercel.app/api/rolls \
            -H "Content-Type: application/json" \
            -d "$body"

      - name: Summary
        run: |
          roll='${{ steps.roll.outputs.roll_response }}'
          track_count=$(echo "$roll" | node -e "
            const r = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log(r.tracks.length);
          ")
          failed=$(echo "$roll" | node -e "
            const r = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log(r.seeds_failed ?? 0);
          ")
          today=$(date -u +%Y-%m-%d)
          echo "Created playlist 'CrateDig Auto-Roll $today' with $track_count tracks from 8 seeds ($failed failed)."
          echo "URL: ${{ steps.playlist.outputs.playlist_url }}"
